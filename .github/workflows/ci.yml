name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace apps/web
      - run: npm run build --workspace apps/web
      - name: Guard against committed secrets
        run: |
          if grep -rInE 'sk_live_|service_role.*eyJ|BEGIN (RSA |EC )?PRIVATE KEY' --exclude-dir=node_modules .; then
            echo "Possible secret committed"; exit 1
          fi
